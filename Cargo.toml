[package]
name = "flavorapp"
version = "1.0.0"
description = "FlavorTown, in a desktop App"
authors = ["KodeurKubik <kubik@openvoxel.studio>"]
edition = "2024"

[lib]
name = "flavorapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde_json = "1"
serde = "1"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
